<style>
/* Custom loading screen: the game's menu art instead of Godot's default splash,
   with a branded progress bar in the empty space above the logo. */
#status{background:#151515 !important}
#status-splash{object-fit:cover !important;object-position:center bottom}
#status-progress{display:none !important}
#nh-loading{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);width:min(440px,80vw);text-align:center;font:700 20px/1.3 'Arial Rounded MT Bold','Nunito',Arial,sans-serif;color:#fff;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.3px}
#nh-loading .bar{margin-top:14px;height:14px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#nh-loading .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd000,#ff7a00,#ff2e2e);transition:width .25s ease}
#nh-loading .pct{margin-top:8px;font-size:14px;font-weight:600;color:#d8d8d8}
</style>
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var status = document.getElementById('status');
    var progress = document.getElementById('status-progress');
    if (!status || !progress) { return; }
    var box = document.createElement('div');
    box.id = 'nh-loading';
    box.innerHTML = 'Loading Node Hunger…<div class="bar"><div class="fill"></div></div><div class="pct">0%</div>';
    status.appendChild(box);
    var fill = box.querySelector('.fill');
    var pct = box.querySelector('.pct');
    // Godot updates the hidden <progress> element; mirror it into the styled bar.
    var timer = setInterval(function () {
      if (!document.body.contains(status)) { clearInterval(timer); return; }
      var p = progress.max ? Math.round(progress.value / progress.max * 100) : 0;
      fill.style.width = p + '%';
      pct.textContent = p >= 100 ? 'Starting…' : p + '%';
    }, 100);
  });
})();
</script>
