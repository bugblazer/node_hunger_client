<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Node Hunger</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #141417;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
#wake-notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;max-width:min(92vw,480px);padding:12px 16px;border-radius:10px;background:rgba(20,20,24,.92);border:1px solid #444;color:#eee;font:14px/1.4 'Noto Sans',Arial,sans-serif;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);display:none}
#wake-notice strong{color:#ffb347}
</style>
<script>
// The game server runs on a free host that sleeps when nobody is playing and takes
// 20-50 s to wake. Start waking it while the game itself is still downloading, and
// tell the player what's happening instead of leaving them on a silent screen.
(function () {
  var HEALTH = 'https://node-hunger-server.onrender.com/health';
  var started = Date.now(), awake = false, box;
  function markAwake() {
    awake = true;
    if (box) { box.style.display = 'none'; }
  }
  // Also count the game's own connection: once its WebSocket opens, the server is
  // up, even if /health is unreachable (e.g. an older server without it).
  var NativeWebSocket = window.WebSocket;
  if (NativeWebSocket) {
    var Patched = function (url, protocols) {
      var ws = protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols);
      ws.addEventListener('open', markAwake);
      return ws;
    };
    Patched.prototype = NativeWebSocket.prototype;
    ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { Patched[k] = NativeWebSocket[k]; });
    window.WebSocket = Patched;
  }
  function show(html) {
    if (!box) { box = document.getElementById('wake-notice'); }
    if (!box) { return; }
    box.innerHTML = html;
    box.style.display = 'block';
  }
  function tick() {
    if (awake) { return; }
    var s = Math.round((Date.now() - started) / 1000);
    show(s < 90
      ? '<strong>Waking up the game server…</strong><br>It sleeps when nobody is playing. This takes up to a minute (' + s + 's).'
      : '<strong>Still waking the server…</strong><br>If nothing happens soon, refresh the page.');
    setTimeout(tick, 1000);
  }
  function ping() {
    if (awake) { return; }
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, 15000);
    fetch(HEALTH, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) { throw new Error(r.status); }
        markAwake();
      })
      .catch(function () { clearTimeout(timer); setTimeout(ping, 3000); });
  }
  ping();
  // Only show the notice if the server doesn't answer straight away.
  setTimeout(function () { if (!awake) { tick(); } }, 1500);
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.createElement('div');
    el.id = 'wake-notice';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  });
})();
</script>
<style>
/* Custom loading screen: the game's menu art instead of Godot's default splash,
   with a branded progress bar in the empty space above the logo. */
#status{background:#151515 !important}
#status-splash{object-fit:cover !important;object-position:center bottom}
#status-progress{display:none !important}
#nh-loading{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);width:min(440px,80vw);text-align:center;font:700 20px/1.3 'Arial Rounded MT Bold','Nunito',Arial,sans-serif;color:#fff;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.3px}
#nh-loading .bar{margin-top:14px;height:14px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#nh-loading .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd000,#ff7a00,#ff2e2e);transition:width .25s ease}
#nh-loading .pct{margin-top:8px;font-size:14px;font-weight:600;color:#d8d8d8}
</style>
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var status = document.getElementById('status');
    var progress = document.getElementById('status-progress');
    if (!status || !progress) { return; }
    var box = document.createElement('div');
    box.id = 'nh-loading';
    box.innerHTML = 'Loading Node Hunger…<div class="bar"><div class="fill"></div></div><div class="pct">0%</div>';
    status.appendChild(box);
    var fill = box.querySelector('.fill');
    var pct = box.querySelector('.pct');
    // Godot updates the hidden <progress> element; mirror it into the styled bar.
    var timer = setInterval(function () {
      if (!document.body.contains(status)) { clearInterval(timer); return; }
      var p = progress.max ? Math.round(progress.value / progress.max * 100) : 0;
      fill.style.width = p + '%';
      pct.textContent = p >= 100 ? 'Starting…' : p + '%';
    }, 100);
  });
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":1469028,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
